function defaultState(){return{tab:'setup',settings:{leagueName:'Newfound Poker League',season:'2026–27',seasonStart:'',seasonEnd:'',eventType:'league',eventName:'2026 Season',seatsPerTable:10,tablesEstimate:2,seatingMode:'random',startingStack:7000,blindLevelDuration:15,blindLevels:[{sb:25,bb:50,min:15},{sb:50,bb:100,min:15},{sb:75,bb:150,min:15},{sb:100,bb:200,min:15},{sb:150,bb:300,min:15},{sb:200,bb:400,min:15},{sb:250,bb:500,min:15},{sb:300,bb:600,min:15},{sb:400,bb:800,min:15},{sb:500,bb:1000,min:15},{sb:600,bb:1200,min:15},{sb:800,bb:1600,min:15},{sb:1000,bb:2000,min:15},{sb:2000,bb:4000,min:15},{sb:4000,bb:8000,min:15},{sb:6000,bb:12000,min:15},{sb:8000,bb:16000,min:15},{sb:10000,bb:20000,min:15}],absentScore:19,seasonWeeks:10,bufferWeeks:2,gameDays:['Monday'],dropWorst:true,partnerSeparation:true,money:{entry:0,rebuy:0,rebuyChips:0,rebuyStopLevel:4,bounty:5,badBeat:5,addonCount:0,addonRules:[{untilLevel:1,amount:20,chips:25000}],addonLevel:1,addonAmount:20,addonChips:25000,house:0,houseMode:'Additional'},pitStop:{enabled:true,text:'PIT STOP BETS!',mode:'separate',sharedAmount:0,highHandAmount:5,fiftyAmount:0}},players:starterNames.map((name,i)=>({id:uid(),name,number:i+1,carColor:carColors[i%carColors.length],scores:[],active:true,checkedIn:false,checkinAt:null,out:false,seat:null,table:null,locked:false,partner:'',alias:(lockedPlayerAliases[name]||''),stack:7000,rebuys:0,addon1s:0,addon2s:0,addons:0,addonTransactions:[],bounties:0,bountyBuyIn:false,badBeatBuyIn:false,highHandBuyIn:false,startingAddonSelected:false,eliminatedBy:'',lastOutOrder:null})),tables:[],currentWeek:9,outOrder:[],highHands:[],lockedWeeks:[],archives:[],history:[],completedWeeks:[],weekAttendance:{},knockoutLog:[],rebuyLog:[],tournamentStarted:false,finalTableSet:false,moveHighlights:[],currentBlind:0,clock:{running:false,left:1200,last:Date.now()}}}
function deepMerge(base,got){if(!got||typeof got!=='object')return base;for(const k in got){if(got[k]&&typeof got[k]==='object'&&!Array.isArray(got[k])&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))deepMerge(base[k],got[k]);else base[k]=got[k]}return base}
function load(){try{return deepMerge(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaultState()}}

function nextUnusedCarColor(excludeId='',preferred=''){
  const used=new Set(
    state.players
      .filter(p=>p.id!==excludeId)
      .map(p=>String(p.carColor||'').toLowerCase())
      .filter(Boolean)
  );
  if(preferred && !used.has(String(preferred).toLowerCase()))return preferred;
  const free=carColors.find(c=>!used.has(String(c).toLowerCase()));
  if(free)return free;

  // Fallback: generate a deterministic unused HSL-derived hex if roster grows beyond palette.
  for(let i=0;i<360;i+=7){
    const h=(i + state.players.length*29)%360;
    const s=72,l=52;
    const a=s*Math.min(l,100-l)/100;

      const color=l-a*Math.max(Math.min(k-3,9-k,1),-1);

    };
    const hex=`#${f(0)}${f(8)}${f(4)}`;
    if(!used.has(hex.toLowerCase()))return hex;
  }
  return '#ffffff';
}

function ensureUniqueCarColors(){
  const used=new Set();
  state.players.forEach((p,i)=>{

function autoSelectCurrentLeagueWeek(){
  if(currentEventType()!=='league')return;
  const regular=Math.max(1,Number(state.settings.seasonWeeks||1));
  const buffer=Math.max(0,Number(state.settings.bufferWeeks||0));
  const maxWeek=Math.max(1,regular+buffer);
  const locked=new Set([
    ...(Array.isArray(state.lockedWeeks)?state.lockedWeeks:[]),
    ...(Array.isArray(state.completedWeeks)?state.completedWeeks:[])
  ].map(Number));

  let next=1;
  while(next<=maxWeek&&locked.has(next))next++;
  if(next>maxWeek)next=maxWeek;

  // Never go backwards from a later active week unless the saved week was already locked.
  const current=Math.max(1,Number(state.currentWeek||1));
  if(locked.has(current)||current<next)state.currentWeek=next;
}

function parseYMDUTC(v){
  const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return null;
  const d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));
  return Number.isNaN(d.getTime())?null:d;
}
function formatYMDUTC(d){
  if(!(d instanceof Date)||Number.isNaN(d.getTime()))return '';
  const y=d.getUTCFullYear();
  const m=String(d.getUTCMonth()+1).padStart(2,'0');
  const day=String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function leagueGameDays(){
  const raw=Array.isArray(state.settings.gameDays)?state.settings.gameDays:[];
  return raw.filter(x=>NFPL_WEEKDAYS.includes(x));

function calculateLeagueEndDate(){
  const start=parseYMDUTC(state.settings.seasonStart);
  const weeks=Math.max(1,Number(state.settings.seasonWeeks||1));
  if(!start){
    state.settings.seasonEnd='';
    return '';
  }

  // League duration = N calendar weeks beginning on Start Date.
  // End Date becomes the LAST selected game day inside that N-week window.
  const windowEnd=new Date(start.getTime()+(weeks*7-1)*86400000);
  const days=leagueGameDays();

  if(!days.length){
    state.settings.seasonEnd=formatYMDUTC(windowEnd);
    return state.settings.seasonEnd;
  }

  const wanted=new Set(days.map(x=>NFPL_WEEKDAYS.indexOf(x)));
  let d=new Date(windowEnd.getTime());
  while(d>=start){
    if(wanted.has(d.getUTCDay())){
      state.settings.seasonEnd=formatYMDUTC(d);
      return state.settings.seasonEnd;
    }
    d=new Date(d.getTime()-86400000);
  }

  state.settings.seasonEnd=formatYMDUTC(windowEnd);
  return state.settings.seasonEnd;
}

function insertBlindAfter(i){
  setBlindsPanelOpen(true);
  const levels=state.settings.blindLevels;
  const current=levels[i]||levels.at(-1)||{sb:100,bb:200,min:state.settings.blindLevelDuration||15};

  // Insert directly after the selected level. Start as a copy of that level so
  // Sam can type the exact new blinds/minutes without disturbing any later levels.
  levels.splice(i+1,0,{
    sb:Number(current.sb||0),
    bb:Number(current.bb||0),
    min:Number(current.min||state.settings.blindLevelDuration||15)
  });

  // If the current blind is after the insertion point, keep the tournament on
  // the same logical blind it was already using.
  if(state.currentBlind>i)state.currentBlind++;

/* NFPL locked table logic rules (v88.5)
   - Pregame table planning may use the organizer estimate, but once the tournament starts the required table count is based only on remaining live players and configured seats per table.
   - Initial seating keeps tables as even as possible and randomizes where requested.
   - Partner separation avoids seating selected partners together whenever possible.
   - Locked seats are protected from automatic movement whenever possible.
   - Balance moves always go from the most-populated table to a different table with fewer players.
   - Never balance by pulling from a table and placing the same player back on that same table.
   - Keep balancing until the live tables are actually even within the minimum possible difference.
   - Automatic moves save immediately and visually highlight the moved player.
   - Table reduction always breaks the highest-numbered active table first (Table 3, then Table 2); Table 1 becomes the Final Table.
   - The blind clock keeps running during ordinary table breaks/reductions; it pauses automatically only for Final Table seating.
   - After the Final Table is created, NFPL announces: “Please restart the clock.”
   - Final table consolidates automatically as soon as all live players fit within the configured seats on one table, even if more than two tables are still open.
   - Eliminated players are removed from active seating and do not count toward balancing.
*/

function syncAlphabeticalPlayerNumbers(){
  const collator=new Intl.Collator('en',{numeric:true,sensitivity:'base'});
  [...state.players]

function expectedTableCount(){
  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));

  if(state.tournamentStarted){
    const liveCount=activePlayers().length;
    return Math.max(1,Math.ceil(Math.max(1,liveCount)/seats));
  }

  const checked=checkedPlayers().length;
  const required=Math.max(1,Math.ceil(Math.max(1,checked)/seats));
  const planned=Math.max(1,Math.min(12,Number(state.settings.tablesEstimate||3)||3));
  const highestLockedTable=state.players
    .filter(p=>p.active!==false&&p.locked)
    .reduce((max,p)=>Math.max(max,Number(p.preferredTable||1)),1);

  return Math.max(planned,required,highestLockedTable);
}

  if(p.table&&state.tables.some(t=>t.id===p.table&&t.seats.some(s=>s.playerId===p.id)))return;

  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));
  const needed=Math.max(expectedTableCount(),Math.ceil(Math.max(1,activePlayers().length)/seats));

  if(!Array.isArray(state.tables))state.tables=[];
  while(state.tables.length<needed){
    const nextId=state.tables.length+1;
    state.tables.push({id:nextId,name:'Table '+nextId,seats:Array.from({length:seats},()=>({playerId:null,locked:false}))});
  }

  if(p.locked){
    const tableNum=Math.max(1,Number(p.preferredTable||1));
    const seatNum=Math.max(1,Math.min(seats,Number(p.preferredSeat||1)));
    if(tableNum<=needed){
      const target=state.tables[tableNum-1];
      const slot=target?.seats?.[seatNum-1];
      const partnerSafe=!state.settings.partnerSeparation||!hasPartnerConflict(p,target);
      if(slot&&!slot.playerId&&!slot.locked&&partnerSafe){
        placePlayerAt(p,target,seatNum-1,true);
        return;
      }
    }
    p.locked=false;
  }

  const open=state.tables
    .map((t,idx)=>({t,idx,count:tableCount(t)}))
    .filter(x=>x.t.seats.some(s=>!s.playerId&&!s.locked));

  if(!open.length)return;

  let pool=open;
  if(state.settings.partnerSeparation){
    const safe=open.filter(x=>!hasPartnerConflict(p,x.t));
    if(safe.length)pool=safe;
  }

  const minCount=Math.min(...pool.map(x=>x.count));
  const target=(pool.find(x=>x.count===minCount)||pool[0]).t;
  if(target)placePlayer(p,target);
}

  if(Number(state._activeAttendanceWeek)===week)return;

  const snap=state.weekAttendance[week];
  const checked=new Set(Array.isArray(snap?.checkedIds)?snap.checkedIds:[]);
  state.players.forEach(p=>{
    p.checkedIn=checked.has(p.id);
    p.checkinAt=p.checkedIn?Number(snap?.checkinTimes?.[p.id]||Date.now()):null;
    ensurePlayerWeeklyChoices(p);

function saveCurrentWeekAttendance(){
  const week=Math.max(1,Number(state.currentWeek||1));
  state.weekAttendance=state.weekAttendance&&typeof state.weekAttendance==='object'?state.weekAttendance:{};
  const roster=leagueRosterPlayers();
  const previous=state.weekAttendance[week]||{};
  const checkinTimes={...(previous.checkinTimes||{})};
  roster.forEach(p=>{
    if(p.checkedIn)checkinTimes[p.id]=Number(p.checkinAt||checkinTimes[p.id]||Date.now());
    else delete checkinTimes[p.id];
  });
  state.weekAttendance[week]={
    ...previous,
    week,
    rosterIds:roster.map(p=>p.id),
    checkedIds:roster.filter(p=>p.checkedIn).map(p=>p.id),
    absentIds:roster.filter(p=>!p.checkedIn).map(p=>p.id),
    rosterSize:roster.length,
    checkinTimes
  };

function nfplShuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function lockedSeatOwner(tableNum,seatNum){
  return state.players.find(p=>
    p.active!==false &&
    p.locked &&
    Number(p.preferredTable||1)===Number(tableNum) &&
    Number(p.preferredSeat||1)===Number(seatNum)
  )||null;
}
function seatIsReservedForOther(tableNum,seatNum,playerId=''){
  const owner=lockedSeatOwner(tableNum,seatNum);

}

function placePlayerAt(p,t,seatIndex,lockSeat=false){
  if(!p||!t||seatIndex<0||seatIndex>=t.seats.length)return false;
  const s=t.seats[seatIndex];
  const seatNum=seatIndex+1;
  const owner=lockedSeatOwner(t.id,seatNum);

  if(s.playerId)return false;
  if(owner&&owner.id!==p.id)return false;
  if(s.locked&&(!owner||owner.id!==p.id))return false;

  s.playerId=p.id;
  s.locked=!!(lockSeat||owner);
  s.reservedFor=owner?.id||'';
  p.table=t.id;
  p.seat=seatNum;
  return true;
}
function placePlayer(p,t){

    !s.playerId &&
    !s.locked &&
    !seatIsReservedForOther(t.id,i+1,p.id)

function seatPlayersSmart(players,opts={}){
  const list=[...players].filter(p=>p.active&&p.checkedIn&&!p.out);
  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));
  const requested=Math.max(1,Number(opts.tableCount||expectedTableCount())||1);
  const capacityNeeded=Math.max(1,Math.ceil(Math.max(1,list.length)/seats));
  const highestLockedTable=state.players
    .filter(p=>p.active!==false&&p.locked)
    .reduce((max,p)=>Math.max(max,Number(p.preferredTable||1)),1);
  const tableTotal=Math.max(requested,capacityNeeded,highestLockedTable);

  state.tables=buildEmptyTables(tableTotal);
  const seated=new Set(),claims=new Set();

  // Pregame: all locked seats are reserved, but the player card only appears
  // after that player checks in.
  // Once the tournament starts: only checked-in locked players consume seats.
  const lockedPlayers=state.players
    .filter(p=>
      p.active!==false &&
      p.locked &&
      (!state.tournamentStarted || (p.checkedIn&&!p.out))
    )
    .sort((a,b)=>Number(a.preferredTable||1)-Number(b.preferredTable||1)||
                  Number(a.preferredSeat||1)-Number(b.preferredSeat||1));

  for(const p of lockedPlayers){
    const tableNum=Math.max(1,Number(p.preferredTable||1));
    const seatNum=Math.max(1,Math.min(seats,Number(p.preferredSeat||1)));
    if(tableNum>tableTotal)continue;

    const key=`${tableNum}:${seatNum}`;
    const t=state.tables[tableNum-1];
    const s=t?.seats?.[seatNum-1];
    if(!t||!s||claims.has(key))continue;
    claims.add(key);

    s.locked=true;
    s.reservedFor=p.id;

    if(p.checkedIn&&!p.out){
      s.playerId=p.id;
      p.table=t.id;
      p.seat=seatNum;
      seated.add(p.id);
    }else{
      // Do not populate the locked player until they are actually signed in.
      s.playerId=null;
      p.table=null;
      p.seat=null;
    }
  }

  let movable=list.filter(p=>!seated.has(p.id));

  if(opts.randomize){
    movable=nfplShuffle(movable);
  }else{
    movable.sort((a,b)=>{
      const aa=Number(a.checkinAt||0),bb=Number(b.checkinAt||0);
      if(aa&&bb&&aa!==bb)return aa-bb;
      if(aa&&!bb)return -1;
      if(!aa&&bb)return 1;
      return state.players.indexOf(a)-state.players.indexOf(b);
    });
  }

  let cursor=0;
  for(const p of movable){
    const open=state.tables
      .map((t,idx)=>({t,idx,count:tableCount(t)}))
      .filter(x=>x.t.seats.some((s,i)=>
        !s.playerId &&
        !s.locked &&
        !seatIsReservedForOther(x.t.id,i+1,p.id)
      ));

    if(!open.length)break;

    let pool=open;
    if(state.settings.partnerSeparation){
      const safe=open.filter(x=>!hasPartnerConflict(p,x.t));
      if(safe.length)pool=safe;
    }

    const minCount=Math.min(...pool.map(x=>x.count));
    const balanced=pool.filter(x=>x.count===minCount);

    balanced.sort((a,b)=>{
      const da=(a.idx-cursor+tableTotal)%tableTotal;
      const db=(b.idx-cursor+tableTotal)%tableTotal;
      return da-db;
    });

    const pick=balanced[0]||pool[0]||open[0];
    if(pick&&placePlayer(p,pick.t)){
      cursor=(pick.idx+1)%tableTotal;
    }
  }

  state.moveHighlights=[];
}
function rebuildPregameSeating(){
  if(state.tournamentStarted)return;

  const checked=state.players.filter(p=>p.active!==false&&p.checkedIn&&!p.out);
  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));
  const tableTotal=Math.max(1,expectedTableCount());
  const randomMode=state.settings.seatingMode==='random';

  // IN ORDER:
  // Rebuild deterministically from check-in timestamps. This keeps the first
  // person checked in first, then alternates among the least-filled tables.
  if(!randomMode){
    state.players.forEach(p=>{
      if(!p.checkedIn){
        p.table=null;
        p.seat=null;
      }
    });
    seatPlayersSmart(checked,{tableCount:tableTotal,randomize:false});
    return;
  }

  // RANDOM:
  // Keep already seated checked-in players where they are. Only new arrivals
  // receive a random eligible seat. Locked reservations remain authoritative.
  const oldTables=Array.isArray(state.tables)?state.tables:[];
  const nextTables=buildEmptyTables(tableTotal);

  // First reserve all locked positions, but only populate locked players if HERE.
  for(const owner of state.players.filter(p=>p.active!==false&&p.locked)){
    const tableNum=Math.max(1,Number(owner.preferredTable||1));
    const seatNum=Math.max(1,Math.min(seats,Number(owner.preferredSeat||1)));
    const s=nextTables[tableNum-1]?.seats?.[seatNum-1];
    if(!s)continue;

    s.locked=true;
    s.reservedFor=owner.id;

    if(owner.checkedIn&&!owner.out){
      s.playerId=owner.id;
      owner.table=tableNum;
      owner.seat=seatNum;
    }else{
      owner.table=null;
      owner.seat=null;
    }
  }

  // Restore valid existing seats for checked-in unlocked players.
  const seated=new Set(
    state.players
      .filter(p=>p.checkedIn&&!p.out&&p.locked&&p.table&&p.seat)
      .map(p=>p.id)
  );

  for(const p of checked.filter(p=>!p.locked)){
    let restored=false;
    const oldTable=oldTables.find(t=>t.id===Number(p.table||0));
    const oldSeatNum=Number(p.seat||0);

    if(oldTable&&oldSeatNum>=1&&oldSeatNum<=seats){
      const target=nextTables[oldTable.id-1]?.seats?.[oldSeatNum-1];
      if(target&&!target.playerId&&!target.locked&&!seatIsReservedForOther(oldTable.id,oldSeatNum,p.id)){
        target.playerId=p.id;
        p.table=oldTable.id;
        p.seat=oldSeatNum;
        seated.add(p.id);
        restored=true;
      }
    }

    if(!restored){
      p.table=null;
      p.seat=null;
    }
  }

  state.players.forEach(p=>{
    if(!p.checkedIn||p.out){
      p.table=null;
      p.seat=null;
    }
  });

  state.tables=nextTables;

  // Randomly assign only newly checked-in/unseated players.
  const newcomers=checked.filter(p=>!seated.has(p.id)&&!p.locked);

  for(const p of newcomers){
    const openTables=state.tables
      .map((t,idx)=>({t,idx,count:tableCount(t)}))
      .filter(x=>x.t.seats.some((s,i)=>
        !s.playerId &&
        !s.locked &&
        !seatIsReservedForOther(x.t.id,i+1,p.id)
      ));

    if(!openTables.length)break;

    let pool=openTables;
    if(state.settings.partnerSeparation){
      const safe=openTables.filter(x=>!hasPartnerConflict(p,x.t));
      if(safe.length)pool=safe;
    }

    // Keep table populations balanced, then choose randomly among tied tables.
    const minCount=Math.min(...pool.map(x=>x.count));
    const balancedTables=pool.filter(x=>x.count===minCount);
    const tablePick=balancedTables[Math.floor(Math.random()*balancedTables.length)]||pool[0];

    const openSeats=tablePick.t.seats
      .map((s,i)=>({s,i}))
      .filter(x=>
        !x.s.playerId &&
        !x.s.locked &&
        !seatIsReservedForOther(tablePick.t.id,x.i+1,p.id)
      );

    if(!openSeats.length)continue;
    const seatPick=openSeats[Math.floor(Math.random()*openSeats.length)];

    placePlayerAt(p,tablePick.t,seatPick.i,false);
  }

  state.moveHighlights=[];
}

function occupiedTables(){return state.tables.filter(t=>tableCount(t)>0)}
function tableTransitionInfo(){
  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));
  const live=activePlayers();
  const occupied=occupiedTables();
  const current=occupied.length;
  const liveCount=live.length;
  const needed=liveCount?Math.max(1,Math.ceil(liveCount/seats)):0;
  const currentCapacity=current*seats;
  const nextLowerCapacity=Math.max(0,(current-1)*seats);

  // Final Table: all live players fit on one configured table.
  const finalReady=current>1&&liveCount>0&&liveCount<=seats;

  // Table break: all live players fit on one fewer table than are currently active.
  // Example: 10 live players with 7 seats/table on 3 tables => 2 tables are enough.
  const canReduce=!finalReady&&current>1&&liveCount>0&&liveCount<=nextLowerCapacity&&needed<current;

  return {seats,live,liveCount,occupied,current,needed,currentCapacity,nextLowerCapacity,canReduce,finalReady};
}
function pauseClockForTableBreak(){

function bestDestinationForPlayer(p,dests){
  const ranked=[...dests].filter(t=>t.seats.some(s=>!s.playerId&&!s.locked)).sort((a,b)=>tableCount(a)-tableCount(b)||a.id-b.id);
  const safe=state.settings.partnerSeparation?ranked.filter(t=>!hasPartnerConflict(p,t)):ranked;
  const pool=safe.length?safe:ranked;
  if(!pool.length)return null;
  if(p.locked){
    const preferred=Math.max(1,Math.min(Number(state.settings.seatsPerTable||9),Number(p.preferredSeat||p.seat||1)));
    const exact=pool.find(t=>{const s=t.seats[preferred-1];return s&&!s.playerId&&!s.locked});
    if(exact)return {t:exact,i:preferred-1};
  }
  for(const t of pool){const i=t.seats.findIndex(s=>!s.playerId&&!s.locked);if(i>=0)return {t,i}}
  return null;
}
function consolidationPlan(){
  const x=tableTransitionInfo();
  if(!x.canReduce||x.finalReady)return null;

  // Locked NFPL break order:
  // 3 tables -> break Table 3
  // 2 tables -> Final Table (Table 1)
  // With more tables, always break the highest-numbered occupied table first.
  const source=[...x.occupied].sort((a,b)=>b.id-a.id)[0]||null;
  if(!source)return null;

  const dests=x.occupied
    .filter(t=>t.id!==source.id)
    .sort((a,b)=>tableCount(a)-tableCount(b)||a.id-b.id);

  const movers=source.seats
    .map((s,i)=>({s,i,p:s.playerId?player(s.playerId):null}))
    .filter(x=>x.p&&x.p.active&&x.p.checkedIn&&!x.p.out);

  return {x,source,dests,movers};
}

function partnerTableConflicts(){
  if(!state.settings.partnerSeparation)return [];
  const conflicts=[],seen=new Set();
  for(const p of activePlayers()){
    if(!p.partner)continue;
    const q=player(p.partner);
    if(!q||!q.checkedIn||q.out)continue;
    const key=[p.id,q.id].sort().join('|');
    if(seen.has(key))continue;
    seen.add(key);
    if(p.table&&q.table&&p.table===q.table){
      conflicts.push({a:p,b:q,table:p.table});
    }
  }
  return conflicts;
}

function balanceMovePlan(){
  const activeTables=state.tables.filter(t=>tableCount(t)>0||t.seats.some(s=>s.locked));
  if(activeTables.length<2)return null;

  // Locked rule: always move FROM the most-populated table TO a different table with fewer players.
  const rows=activeTables.map(t=>({t,n:tableCount(t)})).sort((a,b)=>a.n-b.n||a.t.id-b.t.id);
  const low=rows[0],high=rows[rows.length-1];
  if(!low||!high||high.n-low.n<2)return null;
  if(low.t.id===high.t.id)return null;

  const open=low.t.seats.map((s,i)=>({s,i})).filter(x=>!x.s.playerId&&!x.s.locked);
  if(!open.length)return {low,high,open:[],eligible:[]};

  const movable=high.t.seats.map((s,i)=>({s,i,p:s.playerId?player(s.playerId):null}))
    .filter(x=>x.p&&x.p.active&&x.p.checkedIn&&!x.p.out&&!x.s.locked&&!x.p.locked);
  const eligible=state.settings.partnerSeparation?movable.filter(x=>!hasPartnerConflict(x.p,low.t)):movable;
  return {low,high,open,eligible};

function applyBalanceMove(playerId,randomPick=false){

  const chosen=plan.eligible.find(x=>x.p.id===playerId);
  if(!chosen)return toast('That player is no longer eligible to move');
  const target=plan.open[0];
  if(!target||plan.high.t.id===plan.low.t.id)return toast('NFPL could not find a valid table-to-table balance move');
  snapshot(randomPick?'random table balance':'chosen table balance');
  plan.high.t.seats[chosen.i].playerId=null;
  plan.low.t.seats[target.i].playerId=chosen.p.id;
  chosen.p.table=plan.low.t.id;chosen.p.seat=target.i+1;

function makeFinalTable(){
  pauseClockForTableBreak();
  closeTableTransition();
  closeBalanceChooser();
  nfplBalanceAnnouncementKey='';
  const live=activePlayers().filter(p=>p.checkedIn&&!p.out);
  const seats=Math.max(1,Number(state.settings.seatsPerTable||9));
  if(live.length>seats)return toast(`Final table needs ${seats} or fewer live players`);
  if(!live.length)return toast('No live players for a final table');
  snapshot('final table');

  const final=buildEmptyTables(1)[0];
  final.id=1;
  final.name='Final Table';
  state.tables=[final];

  const seated=new Set(),usedSeats=new Set();

  // Preserve locked seat numbers whenever possible.
  for(const p of live.filter(p=>p.locked)){
    let seatNum=Math.max(1,Math.min(seats,Number(p.preferredSeat||p.seat||1)));
    if(usedSeats.has(seatNum)){
      const open=Array.from({length:seats},(_,i)=>i+1).find(n=>!usedSeats.has(n));
      if(!open)continue;
      seatNum=open;
    }
    const s=final.seats[seatNum-1];
    if(!s||s.playerId)continue;
    s.playerId=p.id;
    s.locked=true;
    p.table=1;
    p.seat=seatNum;
    p.preferredTable=1;
    p.preferredSeat=seatNum;
    usedSeats.add(seatNum);
    seated.add(p.id);
  }

  // Randomly seat the remaining live players in the open seats.
  for(const p of nfplShuffle(live.filter(p=>!seated.has(p.id)))){
    const openIndexes=final.seats
      .map((s,i)=>({s,i}))
      .filter(x=>!x.s.playerId&&!x.s.locked)
      .map(x=>x.i);
    if(!openIndexes.length)break;
    const i=openIndexes[Math.floor(Math.random()*openIndexes.length)];
    final.seats[i].playerId=p.id;
    p.table=1;
    p.seat=i+1;
  }

  state.moveHighlights=live.map(p=>({pid:p.id,until:Date.now()+60000}));
  state.finalTableSet=true;
  save();
  render();
  toast('Final Table set automatically • Table 1 is now the Final Table');
  setTimeout(()=>{
    toast('Please restart the clock');
    nfplSpeak('Please restart the clock.');
  },500);
}

function currentSeatForPlayer(pid){

        return {table:t,seat:i+1};

    }
  }
  return null;
}

function completeKnockout(result){
  const victim=player(pendingKnockoutId),killer=player(pendingKillerId);
  if(!victim||!killer)return closeKnockout();

  if(!knockoutCandidates(victim).some(p=>p.id===killer.id)){
    closeKnockout();
    return toast('Players are no longer at the same table');
  }

  if(result==='rebuy'&&!rebuyIsAvailable()){
    return toast('Rebuy is no longer available at this blind level');
  }

  const m=state.settings.money||{};
  const tableId=victim.table;
  const seatNo=victim.seat;

  // IMPORTANT:
  // A player carries ONE personal bounty.
  // Any bounties they previously won stay credited to them and do not transfer.
  const personalBountyActive=bountyApplies(victim);
  const bountyAwarded=personalBountyActive?Number(m.bounty||0):0;

  snapshot(result==='rebuy'?'knockout + rebuy':'knockout + elimination');

  victim.lastKnockoutTable=tableId;
  victim.lastKnockoutSeat=seatNo;
  victim.lastKnockedOutBy=killer.id;
  victim.knockoutEvents=Array.isArray(victim.knockoutEvents)?victim.knockoutEvents:[];

  const killerBefore=trackedPlayerStats(killer);

  const event={
    id:uid(),
    time:Date.now(),
    week:state.currentWeek,
    killerId:killer.id,
    killerName:killer.name,
    victimId:victim.id,
    victimName:victim.name,
    table:tableId,
    seat:seatNo,
    blindLevel:state.currentBlind+1,
    result,
    bountyAwarded,
    bountyUnits:bountyAwarded>0?1:0,
    bountyWinnerId:bountyAwarded?killer.id:'',
    bountyWinnerName:bountyAwarded?killer.name:'',
    bountyAutoAwarded:!!bountyAwarded,
    victimPersonalBountyOnly:true,
    killerBountiesBefore:Number(killerBefore.bounties||0)
  };

  victim.knockoutEvents.push(event);
  state.knockoutLog.push(event);

  if(result==='rebuy'){
    victim.rebuys=Number(victim.rebuys||0)+1;

    state.rebuyLog.push({
      id:uid(),
      time:Date.now(),
      week:state.currentWeek,
      playerId:victim.id,
      playerName:victim.name,
      amount:Number(m.rebuy||0),
      chips:Number(m.rebuyChips||0),
      blindLevel:state.currentBlind+1,
      knockoutEventId:event.id,
      killerId:killer.id,
      killerName:killer.name
    });

    victim.out=false;
    victim.eliminatedBy='';
    victim.lastOutOrder=null;
    victim.stack=Number(m.rebuyChips||state.settings.startingStack||0);
    state.outOrder=state.outOrder.filter(x=>x!==victim.id);

    syncTrackedPlayerStats();
    syncCurrentWeekPlaces();
    refreshCurrentWeekArchiveIfPresent();

    closeKnockout();
    save();
    render();

    const killerStats=trackedPlayerStats(killer);
    toast(`${killer.name} knocked out ${victim.name} • Rebuy #${victim.rebuys}`+
      (bountyAwarded?` • +1 bounty • ${killerStats.bounties} total • $${killerStats.bountyAmount}`:' • No bounty'));

    // After the rebuy is registered, offer the player's next configured add-on
    // when it is still available at the current blind level.
    const used=Number(victim.addons||0);
    const max=Math.max(0,Number(m.addonCount||0));
    const nextRule=used<max?addonRuleForIndex(used):null;
    const addOnOpen=nextRule&&
      (Number(nextRule.amount||0)>0||Number(nextRule.chips||0)>0)&&
      (state.currentBlind+1)<=Math.max(1,Number(nextRule.untilLevel||1));

  }

  victim.out=true;
  victim.eliminatedBy=killer.id;
  victim.lastOutOrder=state.outOrder.length+1;
  if(!state.outOrder.includes(victim.id))state.outOrder.push(victim.id);

  forceRemoveFromSeats(victim.id);

  // Recalculate from event logs so prior bounty wins stay with their original winner.
  syncTrackedPlayerStats();
  syncCurrentWeekPlaces();
  refreshCurrentWeekArchiveIfPresent();

  closeKnockout();

  const winner=finalizeWeekIfWinner();

  save();
  render();

  const killerStats=trackedPlayerStats(killer);

  if(winner){
    toast(
      `Week ${state.currentWeek} complete • ${winner.name} wins` +
      (bountyAwarded
        ? ` • ${killer.name} now has ${killerStats.bounties} bount${killerStats.bounties===1?'y':'ies'} ($${killerStats.bountyAmount})`
        : '')
    );
    return;
  }

  const handled=checkTableStructure('knockout');

  if(!handled){
    if(bountyAwarded){
      toast(`${killer.name} eliminated ${victim.name} • +1 bounty • ${killerStats.bounties} total • $${killerStats.bountyAmount}`);
    }else{
      toast(`${killer.name} eliminated ${victim.name} • No bounty`);
    }
  }
}

function liveViewStandingsData(){
  refreshCurrentWeekRosterPoints();
  const week=Math.max(1,Number(state.currentWeek||1));
  const idx=week-1;
  const archived=archiveForWeek(week);
  const currentWeekFinalized=!!(archived&&archived.finalized);

  // If this week is finalized, sort the archived snapshot by THIS WEEK'S points,
  // lowest score first. This keeps the winner (0) in 1st place.
  if(currentWeekFinalized){
    const rows=archiveRowsForView(archived);
    if(rows.length){
      return rows.map((r,i)=>({
        ...r,
        id:r.id||state.players.find(p=>p.name===r.name)?.id||'',
        carColor:r.carColor||state.players.find(p=>p.name===r.name)?.carColor||'',
        checkedIn:r.checkedIn!==false,
        out:!!r.out,
        total:Number(r.total||0),
        drop:Number(r.drop||0),
        _archivePosition:Number(r.position||i+1),
        _archiveBehind:Number(r.behind||0),
        _archivedWeek:week
      })).sort((a,b)=>{
        const ap=Array.isArray(a.scores)?a.scores[idx]:null;
        const bp=Array.isArray(b.scores)?b.scores[idx]:null;
        const av=(ap===null||ap===undefined||ap==='')?Number.POSITIVE_INFINITY:Number(ap);
        const bv=(bp===null||bp===undefined||bp==='')?Number.POSITIVE_INFINITY:Number(bp);
        return av-bv||Number(a.total||0)-Number(b.total||0)||String(a.name||'').localeCompare(String(b.name||''));
      });
    }
  }

  const rows=standings();
  const info=currentWeekPlaceRows();
  const scoreById=info.scoreById;
  const outIndex=new Map(info.outIds.map((id,i)=>[id,i]));

  return rows.sort((a,b)=>{
    const pa=player(a.id)||a, pb=player(b.id)||b;

    // Still-live checked-in players stay above anyone already out or absent.
    const aLive=!!pa.checkedIn&&!pa.out;
    const bLive=!!pb.checkedIn&&!pb.out;
    if(aLive!==bLive)return aLive?-1:1;

    // Eliminated checked-in players come next, using current-week points:
    // lower points rank higher, so later outs climb upward from the bottom.
    const aOut=!!pa.checkedIn&&!!pa.out;
    const bOut=!!pb.checkedIn&&!!pb.out;
    if(aOut!==bOut)return aOut?-1:1;

    // Absentees stay at the bottom.
    const aAbsent=!pa.checkedIn;
    const bAbsent=!pb.checkedIn;
    if(aAbsent!==bAbsent)return aAbsent?1:-1;

    const as=scoreById.has(pa.id)?Number(scoreById.get(pa.id)):Number.POSITIVE_INFINITY;
    const bs=scoreById.has(pb.id)?Number(scoreById.get(pb.id)):Number.POSITIVE_INFINITY;
    if(as!==bs)return as-bs;

    // Among still-live players whose weekly finishing score is not known yet,
    // keep the lower season total first as a stable tiebreaker.
    if(aLive&&bLive){
      const t=Number(a.total||0)-Number(b.total||0);
      if(t)return t;
    }

    // Stable elimination-order tiebreaker when needed.
    const ao=outIndex.has(pa.id)?outIndex.get(pa.id):Number.POSITIVE_INFINITY;
    const bo=outIndex.has(pb.id)?outIndex.get(pb.id):Number.POSITIVE_INFINITY;
    if(ao!==bo)return bo-ao;

    return String(a.name||'').localeCompare(String(b.name||''));
  });
}
function archiveWeekNumber(a){if(Number(a?.week)>0)return Number(a.week);const m=String(a?.name||'').match(/(?:week|w)\s*#?\s*(\d+)/i);return m?Number(m[1]):0}

function weeklyBountyForPlayer(week,playerId,playerName,archive=null){
  const log=Array.isArray(archive?.knockoutLog)
    ? archive.knockoutLog
    : (Array.isArray(state.knockoutLog)?state.knockoutLog:[]);

  const rows=log.filter(e=>{
    const sameWeek=Number(e.week||0)===Number(week);
    const samePlayer=(playerId&&e.killerId===playerId)||(playerName&&e.killerName===playerName);
    return sameWeek&&samePlayer&&Number(e.bountyAwarded||0)>0;
  });

  const unique=new Map();
  rows.forEach(e=>{
    const key=`${Number(e.week||0)}:${e.victimId||e.victimName||e.id}`;
    if(!unique.has(key))unique.set(key,e);
  });

  const bountyRows=[...unique.values()];

  return {
    count:bountyRows.length,
    amount:bountyRows.reduce((sum,e)=>sum+Number(e.bountyAwarded||0),0)
  };

function lockCurrentHighHand(){
  const weekNum=Math.max(1,Number(state.currentWeek||1));
  const week=`W${weekNum}`;
  const cur=currentHHForWeek(weekNum);

  if(!cur?.player||!String(cur.hand||'').trim()){
    return toast('Enter the current High Hand and player first');
  }

  snapshot('lock high hand + close week');

  const existing=state.highHands.findIndex(x=>formatWeekLabel(x.week)===week);
  const entry={
    week,
    player:cur.player,
    hand:String(cur.hand).trim(),
    updatedAt:Date.now(),
    lockedAt:Date.now()
  };
  if(existing>=0)state.highHands[existing]={...state.highHands[existing],...entry};
  else state.highHands.push(entry);

  if(!state.hhLockedWeeks.includes(weekNum))state.hhLockedWeeks.push(weekNum);
  if(!state.lockedWeeks.includes(weekNum))state.lockedWeeks.push(weekNum);

  // Lock the final standings snapshot for this week.
  syncCurrentWeekPlaces();
  const priorArchive=archiveForWeek(weekNum);
  upsertWeekArchive(weekNum,priorArchive?.name||`Week ${weekNum}`);
  const a=archiveForWeek(weekNum);
  if(a){
    a.finalized=true;
    a.lockedAt=Date.now();
    a.highHand={...entry};
  }

  if(!state.completedWeeks.includes(weekNum))state.completedWeeks.push(weekNum);

  // Advance automatically to the next week.
  const maxWeek=Math.max(1,Number(state.settings.seasonWeeks||1)+Number(state.settings.bufferWeeks||0));
  const nextWeek=Math.min(maxWeek,weekNum+1);

  if(nextWeek>weekNum){
    state.currentWeek=nextWeek;
    state.tournamentStarted=false;
    state.finalTableSet=false;
    state.tables=[];
    state.outOrder=[];
    state.moveHighlights=[];
    state.currentBlind=0;
    state.clock={
      running:false,
      left:(state.settings.blindLevels[0]?.min||state.settings.blindLevelDuration||15)*60,
      last:Date.now()
    };

    // New week attendance and optional buy-ins start fresh.
    state.players.forEach(p=>{
      p.checkedIn=false;
      p.checkinAt=null;
      p.out=false;
      p.table=null;
      p.seat=null;
      p.bountyBuyIn=false;
      p.highHandBuyIn=false;
      p.badBeatBuyIn=false;
      p.startingAddonSelected=false;
      p._activeChoiceWeek=nextWeek;
    });
    state._activeAttendanceWeek=nextWeek;
  }

  save();
  render();
  toast(nextWeek>weekNum
    ? `Week ${weekNum} locked • High Hand saved • Week ${nextWeek} ready`
    : `Week ${weekNum} locked • High Hand saved`);
}

function standings(){
  // Always rebuild CURRENT WEEK from the current league roster before totals are calculated.
  refreshCurrentWeekRosterPoints();

  return state.players.map(p=>{
    const pts=p.scores.map(x=>Number(x)).filter(x=>Number.isFinite(x));
    let drop=0;
    if(state.settings.dropWorst&&pts.length>1)drop=Math.max(...pts);
    const raw=pts.reduce((a,b)=>a+b,0);
    return{...p,drop,total:raw-drop};
  }).sort((a,b)=>a.total-b.total||a.name.localeCompare(b.name));
}

function leagueBufferWeeks(){return Math.max(0,Math.min(6,Number(state.settings.bufferWeeks??2)||0))}
function plannedLeagueStandingsWeeks(){return regularLeagueWeeks()+leagueBufferWeeks()}
function isLeagueBufferWeek(week){return currentEventType()==='league'&&Number(week)>regularLeagueWeeks()}
function weekHeaderLabel(week){return `W${Math.max(1,Number(week||1))}`}
function weekHeaderSubLabel(week){return isLeagueBufferWeek(week)?`Buffer ${Number(week)-regularLeagueWeeks()}`:'Pts / HH'}
function maxWeeks(){
  const scoreMax=Math.max(0,...state.players.map(p=>Array.isArray(p.scores)?p.scores.length:0));
  const current=Math.max(1,Number(state.currentWeek||1));
  if(currentEventType()==='league')return Math.max(plannedLeagueStandingsWeeks(),current,scoreMax);
  return Math.max(1,current,scoreMax);
}

function leagueRosterPlayers(){
  // The roster shown in Players ("roster • N") is the point-scale authority.
  // Deleting a player removes the player record, which immediately changes N.
  return state.players.slice();
}

function leagueRosterSize(){

function reconcileCurrentWeekRosterSnapshot(){
  const week=Math.max(1,Number(state.currentWeek||1));
  const roster=leagueRosterPlayers();
  state.settings.absentScore=roster.length;

  state.weekAttendance=state.weekAttendance&&typeof state.weekAttendance==='object'?state.weekAttendance:{};
  const snap=state.weekAttendance[week];
  if(!snap)return roster;

  const ids=new Set(roster.map(p=>p.id));
  snap.rosterIds=roster.map(p=>p.id);
  snap.checkedIds=roster.filter(p=>p.checkedIn).map(p=>p.id);
  snap.absentIds=roster.filter(p=>!p.checkedIn).map(p=>p.id);
  snap.rosterSize=roster.length;
  return roster;
}

function refreshCurrentWeekRosterPoints(){
  const week=Math.max(1,Number(state.currentWeek||1));
  const idx=week-1;
  const info=currentWeekPlaceRows();

  info.roster.forEach(p=>{
    while(p.scores.length<=idx)p.scores.push(null);

    // Pregame/current-week values must be blank until the game starts.
    if(!state.tournamentStarted){
      p.scores[idx]=null;
      return;
    }

    if(info.scoreById.has(p.id)){
      p.scores[idx]=info.scoreById.get(p.id);
    }else{
      // Live players never retain an old/stale placement number.
      p.scores[idx]=null;
    }
  });

  return info;
}

function currentWeekPlaceRows(){
  const week=Math.max(1,Number(state.currentWeek||1));
  const roster=reconcileCurrentWeekRosterSnapshot();
  const snap=state.weekAttendance&&state.weekAttendance[week];

  const checked=roster.filter(p=>p.checkedIn);
  const absent=roster.filter(p=>!p.checkedIn);
  const checkedSet=new Set(checked.map(p=>p.id));

  // Only a player who is ACTUALLY marked Out can carry an elimination place.
  // This prevents stale outOrder entries from a prior test/game from assigning points.
  const outIds=state.outOrder.filter(id=>checkedSet.has(id)&&player(id)?.out);

  const scoreById=new Map();
  const absentScore=roster.length;
  const firstOutScore=checked.length;

  // Before the tournament starts, the current week's standings stay blank.
  // Check-in status alone must never pre-populate weekly points.
  if(!state.tournamentStarted){
    return {
      week,roster,checked,absent,outIds:[],remaining:checked,scoreById,
      absentScore,firstOutScore,attendanceLocked:!!snap
    };
  }

  // Once the tournament is live:
  // absentees take roster-size points;
  // actual eliminations descend from checked-in count to 2;
  // winner gets 0.
  absent.forEach(p=>scoreById.set(p.id,absentScore));
  outIds.forEach((id,i)=>scoreById.set(id,Math.max(2,firstOutScore-i)));

  const remaining=checked.filter(p=>!outIds.includes(p.id)&&!p.out);
  if(remaining.length===1)scoreById.set(remaining[0].id,0);

  return {
    week,roster,checked,absent,outIds,remaining,scoreById,
    absentScore,firstOutScore,attendanceLocked:!!snap
  };
}

function buildWeekArchiveRecord(week,name){return{name:name||`Week ${week}`,week,time:Date.now(),attendanceSnapshot:JSON.parse(JSON.stringify(state.weekAttendance?.[week]||{})),maxWeeks:maxWeeks(),standings:standings().map(p=>({id:p.id,name:p.name,number:p.number||'',carColor:p.carColor||'',total:p.total,drop:p.drop,scores:Array.isArray(p.scores)?[...p.scores]:[]})),standingsSnapshot:archiveSnapshotRows(),highHands:JSON.parse(JSON.stringify(state.highHands||[])),outOrder:[...state.outOrder],knockoutLog:JSON.parse(JSON.stringify(state.knockoutLog)),rebuyLog:JSON.parse(JSON.stringify(state.rebuyLog)),playerStats:state.players.map(p=>{const s=trackedPlayerStats(p);return{id:p.id,name:p.name,number:p.number||'',knockouts:Number(s.knockouts||0),bounties:Number(s.bounties||0),bountyAmount:Number(s.bountyAmount||0),rebuys:Number(s.rebuys||0)}})}}

function finalizeWeekIfWinner(){
  if(!state.tournamentStarted)return false;
  const week=Math.max(1,Number(state.currentWeek||1));
  state.completedWeeks=Array.isArray(state.completedWeeks)?state.completedWeeks:[];
  const existing=archiveForWeek(week);
  if(state.completedWeeks.includes(week)&&existing?.finalized)return player(existing.winnerId)||state.players.find(p=>p.name===existing.winnerName)||false;
  const info=syncCurrentWeekPlaces();
  if(info.checked.length<1||info.remaining.length!==1)return false;
  const winner=info.remaining[0],idx=week-1;
  while(winner.scores.length<=idx)winner.scores.push(null);
  winner.scores[idx]=0;
  syncCurrentWeekPlaces();
  state.clock.running=false;
  state.clock.left=Math.max(0,Number(state.clock.left||0));
  state.clock.last=Date.now();
  if(!state.completedWeeks.includes(week))state.completedWeeks.push(week);
  const record=upsertWeekArchive(week,`Week ${week}`);
  record.finalized=true;
  record.winnerId=winner.id;
  record.winnerName=winner.name;
  record.finalizedAt=Date.now();
  record.attendanceSnapshot=JSON.parse(JSON.stringify(state.weekAttendance?.[week]||{}));
  record.autoSaved=true;
  return winner;
}

const NFPL_LOCKED_BLIND_STRUCTURE='18 levels • 15 min';
const NFPL_LOCKED_BLIND_LEVELS=[{sb:25,bb:50,min:15},{sb:50,bb:100,min:15},{sb:75,bb:150,min:15},{sb:100,bb:200,min:15},{sb:150,bb:300,min:15},{sb:200,bb:400,min:15},{sb:250,bb:500,min:15},{sb:300,bb:600,min:15},{sb:400,bb:800,min:15},{sb:500,bb:1000,min:15},{sb:600,bb:1200,min:15},{sb:800,bb:1600,min:15},{sb:1000,bb:2000,min:15},{sb:2000,bb:4000,min:15},{sb:4000,bb:8000,min:15},{sb:6000,bb:12000,min:15},{sb:8000,bb:16000,min:15},{sb:10000,bb:20000,min:15}];
function blindLabel(){const b=state.settings.blindLevels[state.currentBlind]||state.settings.blindLevels[0];return b?`${b.sb}/${b.bb} • ${b.min||state.settings.blindLevelDuration} min`:'No blinds'}
function currentBlindData(){return state.settings.blindLevels[state.currentBlind]||state.settings.blindLevels[0]||null}
function nextBlindData(){return state.settings.blindLevels[state.currentBlind+1]||null}
function blindLevelText(index,blind){return blind?`L${index+1} • ${blind.sb}/${blind.bb}`:'No blinds'}
let nfplMinuteWarningKey='';
let nfplLevelAnnouncementKey='';
let nfplBalanceAnnouncementKey='';
function nfplSpeak(text){
  try{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text||''));
    u.rate=1.02;u.pitch=.92;u.volume=1;
    const voices=window.speechSynthesis.getVoices?.()||[];
    const preferred=voices.find(v=>/^en(-|_)?US/i.test(v.lang)&&/male|david|mark|guy|aaron/i.test(v.name))||voices.find(v=>/^en(-|_)?US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(preferred)u.voice=preferred;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function nfplAnnounceMinuteRemaining(){
  const next=nextBlindData();
  const key=`${state.currentBlind}:${state.clock.left}`;
  if(nfplMinuteWarningKey===key)return;
  nfplMinuteWarningKey=key;
  nfplSpeak(next?`One minute remaining. Next blinds are ${next.sb} and ${next.bb}.`:'One minute remaining in the final blind level.');
}
function nfplAnnounceNewBlind(){
  const b=currentBlindData();
  const key=String(state.currentBlind);
  if(!b||nfplLevelAnnouncementKey===key)return;
  nfplLevelAnnouncementKey=key;
  nfplSpeak(`New blinds are ${b.sb} and ${b.bb}. Level ${state.currentBlind+1}.`);
}
function nfplAnnounceTableBalance(needsTableName,sourceTableName,announceKey=''){
  const needsLabel=String(needsTableName||'Table').trim();
  const sourceLabel=String(sourceTableName||'Table').trim();
  const msg=`${needsLabel} needs to be balanced, please send a player from ${sourceLabel}.`;
  if(announceKey&&nfplBalanceAnnouncementKey===announceKey)return;
  if(announceKey)nfplBalanceAnnouncementKey=announceKey;
  toast(msg);
  nfplSpeak(msg);
}
function closeClockResetChooser(){document.getElementById('nfplClockResetOverlay')?.remove()}
function resetClock(){
  closeClockResetChooser();
  const levels=Array.isArray(state.settings.blindLevels)?state.settings.blindLevels:[];
  if(!levels.length)return toast('No blind levels are configured');
  const wrap=document.createElement('div');

function resetClockToLevel(levelIndex){
  const levels=Array.isArray(state.settings.blindLevels)?state.settings.blindLevels:[];
  const i=Math.max(0,Math.min(levels.length-1,Number(levelIndex)||0));
  const b=levels[i];
  if(!b)return closeClockResetChooser();
  nfplMinuteWarningKey='';nfplLevelAnnouncementKey='';
  state.currentBlind=i;
  state.clock.left=Math.max(1,Number(b.min||state.settings.blindLevelDuration||20)*60);
  state.clock.running=false;
  state.clock.last=Date.now();
  closeClockResetChooser();
  save();render();
  toast(`Blind clock reset to Level ${i+1} • ${Number(b.sb||0)}/${Number(b.bb||0)}`);
}

function restartFinalTableClock(){
  nfplMinuteWarningKey='';
  nfplLevelAnnouncementKey='';
  const first=state.settings.blindLevels[0]||{min:state.settings.blindLevelDuration||15};
  state.currentBlind=0;
  state.clock.left=Math.max(1,Number(first.min||state.settings.blindLevelDuration||15)*60);
  state.clock.running=true;
  state.clock.last=Date.now();
  save();
  render();
  toast('Final Table clock reset to Level 1 and started');
  try{nfplSpeak('Final Table clock reset to Level 1.')}catch(e){}

function nextBlind(){
  const wasRunning=!!state.clock.running;
  const levels=state.settings.blindLevels||[];
  if(!levels.length)return;
  if(state.currentBlind>=levels.length-1){
    state.clock.left=0;
    state.clock.running=false;
    state.clock.last=Date.now();
    save();render();
    return;
  }
  state.currentBlind+=1;
  const b=currentBlindData();
  state.clock.left=(Number(b?.min||state.settings.blindLevelDuration||15))*60;
  state.clock.running=wasRunning;
  state.clock.last=Date.now();
  nfplMinuteWarningKey='';nfplLevelAnnouncementKey='';
  save();render();
  nfplAnnounceNewBlind();

function toggleClock(){
  state.clock.running=!state.clock.running;
  state.clock.last=Date.now();
  save();render();
}
function startClock(){
  if(state.clock.running)return;
  // A running blind clock means live play has begun. Repair restored saves
  // whose seated tables did not retain the tournamentStarted flag.
  if((state.tables||[]).some(t=>(t.seats||[]).some(s=>!!s.playerId)))state.tournamentStarted=true;
  state.clock.running=true;
  state.clock.last=Date.now();
  save();render();
}
function pauseClock(){
  if(!state.clock.running)return;
  state.clock.running=false;
  state.clock.last=Date.now();
  save();render();
}
function formatClock(){
  const m=Math.floor(state.clock.left/60),s=state.clock.left%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function refreshTablesClockDisplay(){
  const current=currentBlindData();
  const next=nextBlindData();
  const timeEl=$('tablesClockTime');
  const currentEl=$('tablesClockCurrent');
  const nextEl=$('tablesClockNext');
  const statusEl=$('tablesClockStatus');
  const breakPaused=!state.clock.running&&tableTransitionInfo().finalReady;
  if(timeEl)timeEl.textContent=formatClock();
  if(currentEl)currentEl.textContent=blindLevelText(state.currentBlind,current);
  if(nextEl)nextEl.textContent=next?blindLevelText(state.currentBlind+1,next):'Game End';
  if(statusEl)statusEl.textContent=breakPaused?'Paused for Final Table':(state.clock.running?'Clock running':'Clock ready');
}
setInterval(()=>{
  if(!state.clock.running)return;
  const levels=state.settings.blindLevels||[];
  if(!levels.length){state.clock.running=false;state.clock.left=0;save();refreshTablesClockDisplay();return;}

  state.clock.left=Math.max(0,Number(state.clock.left||0)-1);
  state.clock.last=Date.now();

  if(state.clock.left===60)nfplAnnounceMinuteRemaining();

  if(state.clock.left<=0){
    if(state.currentBlind<levels.length-1){
      state.currentBlind+=1;
      const nextLevel=levels[state.currentBlind];
      state.clock.left=Math.max(1,Number(nextLevel?.min||state.settings.blindLevelDuration||15)*60);
      state.clock.running=true;
      state.clock.last=Date.now();
      nfplMinuteWarningKey='';nfplLevelAnnouncementKey='';
      save();
      render();
      nfplAnnounceNewBlind();
      return;
    }
    state.clock.left=0;
    state.clock.running=false;
    save();
    render();
    return;
  }

  save();
  refreshTablesClockDisplay();
},1000);

<script>window.NFPL_SYNC_ENDPOINT='https://script.google.com/macros/s/AKfycbz11OfouNOUqNhDbRuSGK9ua50ag6yPNTFwGjrmLOitZccpQx8pid_xVvhw9x9tTRQE4g/exec';</script>
<script id="nfpl-pv2-sync-script">
const NFPL_SYNC_CONFIG_KEY='nfpl_pv2_sync_config';
const NFPL_APP_VERSION='NFPL-v88.83';
const NFPL_SYNC_ENDPOINT_KEY='nfpl_amb_sync_endpoint';
function syncEndpoint(){
  return String(localStorage.getItem(NFPL_SYNC_ENDPOINT_KEY)||window.NFPL_SYNC_ENDPOINT||'').trim();
}
function setSyncEndpoint(url){
  const clean=String(url||'').trim();
  if(clean)localStorage.setItem(NFPL_SYNC_ENDPOINT_KEY,clean);
  else localStorage.removeItem(NFPL_SYNC_ENDPOINT_KEY);
  return clean;
}

function syncConfig(){
  let c={linkId:'nfpl-main',deviceId:'',autoSync:true,revision:0,lastCloudAt:'',lastMessage:'Ready'};
  try{Object.assign(c,JSON.parse(localStorage.getItem(NFPL_SYNC_CONFIG_KEY)||'{}'));}catch(e){}
  c.linkId='nfpl-main';
  c.autoSync=true;
  if(!c.deviceId)c.deviceId='dev-'+Math.random().toString(36).slice(2,8)+'-'+Date.now().toString(36).slice(-4);
  localStorage.setItem(NFPL_SYNC_CONFIG_KEY,JSON.stringify(c));
  return c;
}

let nfplSync=syncConfig();
let nfplSyncBusy=false;
let nfplLastSyncedState='';
let nfplAutoTimer=null;
let nfplPullTimer=null;
let nfplConflict=false;

function syncHosted(){return !!((window.google&&google.script&&google.script.run)||syncEndpoint())}
function saveSyncConfig(){localStorage.setItem(NFPL_SYNC_CONFIG_KEY,JSON.stringify(nfplSync));}

/* Deterministic payload: no Date.now() in comparison data. */
function syncPayload(){
  return JSON.stringify({
    state:state,
    eventLibrary:getEventLibrary(),
    appVersion:NFPL_APP_VERSION
  });
}

function setSyncMessage(msg,kind){
  nfplSync.lastMessage=msg;
  saveSyncConfig();
  const p=document.getElementById('autoSyncStatus');
  const btn=document.getElementById('headerSyncBtn');
  if(p){
    p.textContent=msg;
    p.style.color=kind==='bad'?'#ffb4b4':kind==='warn'?'#ffe09a':'#9fe5bd';
  }
  if(btn){
    btn.textContent=kind==='warn'?'AMB Sync !':kind==='bad'?'Retry Sync':'AMB Sync';
  }
}

function cloudCall(name,args,onOk,onErr){
  /* Native Apps Script transport when NFPL itself is hosted there. */
  if(window.google&&google.script&&google.script.run){
    try{
      let runner=google.script.run
        .withSuccessHandler(onOk||(()=>{}))
        .withFailureHandler(err=>{
          nfplSyncBusy=false;
          setSyncMessage('Sync error','bad');
          if(onErr)onErr(err);
        });
      runner[name](...args);
      return;
    }catch(e){
      nfplSyncBusy=false;
      setSyncMessage('Sync error','bad');
      if(onErr)onErr(e);
      return;
    }
  }

  /* REST transport for acemybusiness.app / standalone hosting. */
  const endpoint=syncEndpoint();
  if(!endpoint){
    nfplSyncBusy=false;
    setSyncMessage('AMB connection required','warn');
    if(onErr)onErr(new Error('AMB sync endpoint not configured'));
    return;
  }

  const action=name==='nfplSyncPull'?'pull':'push';
  const body=action==='pull'
    ? {action:'pull',linkId:args[0]}
    : {action:'push',linkId:args[0],deviceId:args[1],baseRevision:args[2],payloadJson:args[3],force:!!args[4]};

  fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),
    redirect:'follow'
  })
  .then(r=>r.text())
  .then(t=>{
    let res;
    try{res=JSON.parse(t)}catch(e){throw new Error('Invalid AMB sync response')}
    if(onOk)onOk(res);
  })
  .catch(err=>{
    nfplSyncBusy=false;
    setSyncMessage('Sync error','bad');
    if(onErr)onErr(err);
  });
}
function scheduleAutoSync(){
  if(!nfplSync.autoSync||!syncHosted())return;
  clearTimeout(nfplAutoTimer);
  nfplAutoTimer=setTimeout(()=>{
    if(nfplSyncBusy)return scheduleAutoSync();
    const current=syncPayload();
    if(current!==nfplLastSyncedState)syncPush(false);
  },1200);
}

function syncPush(force){
  if(nfplSyncBusy||!syncHosted())return;
  nfplSyncBusy=true;
  setSyncMessage('Syncing…','');
  const payload=syncPayload();

  cloudCall('nfplSyncPush',[
    nfplSync.linkId,
    nfplSync.deviceId,
    Number(nfplSync.revision||0),
    payload,
    !!force
  ],res=>{
    nfplSyncBusy=false;
    if(!res||!res.ok){
      if(res&&res.conflict){
        nfplSync.revision=Number(res.revision||0);
        nfplConflict=true;
        saveSyncConfig();
        setSyncMessage('Newer copy available','warn');
        toast('Another device saved newer NFPL data. Tap Sync Now before continuing.');
      }else{
        setSyncMessage('Sync failed','bad');
      }
      return;
    }

    nfplConflict=false;
    nfplSync.revision=Number(res.revision||0);
    nfplSync.lastCloudAt=res.updatedAt||'';
    nfplLastSyncedState=payload;
    saveSyncConfig();
    setSyncMessage('Synced','good');
  });
}

function syncPull(silent){
  if(nfplSyncBusy||!syncHosted())return;
  nfplSyncBusy=true;
  if(!silent)setSyncMessage('Syncing…','');

  cloudCall('nfplSyncPull',[nfplSync.linkId],res=>{
    nfplSyncBusy=false;
    if(!res||!res.ok){
      if(!silent)setSyncMessage('Sync failed','bad');
      return;
    }

    if(!res.found){
      nfplSync.revision=0;
      saveSyncConfig();
      nfplLastSyncedState=syncPayload();
      setSyncMessage('Ready','good');
      scheduleAutoSync();
      return;
    }

    try{
      const cloudRevision=Number(res.revision||0);
      const current=syncPayload();
      const localDirty=!!nfplLastSyncedState && current!==nfplLastSyncedState;

      /* Never overwrite unsynced local edits automatically. */
      if(silent && localDirty && cloudRevision>Number(nfplSync.revision||0)){
        nfplConflict=true;
        nfplSync.revision=cloudRevision;
        saveSyncConfig();
        setSyncMessage('Newer copy available','warn');
        return;
      }

      const pack=JSON.parse(res.payload||'{}');
      if(!pack.state)throw new Error('Shared state is empty');

      state=deepMerge(defaultState(),pack.state);
      normalize();
      if(Array.isArray(pack.eventLibrary))setEventLibraryNoSync(pack.eventLibrary);

      localStorage.setItem(KEY,JSON.stringify(state));
      nfplSync.revision=cloudRevision;
      nfplSync.lastCloudAt=res.updatedAt||'';
      nfplConflict=false;
      saveSyncConfig();

      nfplLastSyncedState=syncPayload();
      render();
      setSyncMessage('Up to date','good');
    }catch(e){
      setSyncMessage('Shared data error','bad');
    }
  });
}

function setEventLibraryNoSync(list){
  localStorage.setItem(NFPL_EVENT_LIBRARY_KEY,JSON.stringify(Array.isArray(list)?list:[]));
}

function syncNow(){
  const current=syncPayload();
  const localDirty=!!nfplLastSyncedState && current!==nfplLastSyncedState;
  if(nfplConflict&&localDirty){
    if(confirm('The phone/laptop has newer shared data. Load the latest AMB shared copy? This will replace unsynced changes on this device.')){
      syncPull(false);
    }
    return;
  }
  if(localDirty)syncPush(false);
  else syncPull(false);
}

/* Keep old onclick name working; this is now the safe automatic resolver. */
function syncForcePush(){
  if(confirm('Overwrite the shared NFPL copy with this device?'))syncPush(true);
}

/* No separate Backup/Sync card in v87.15. */
function renderSyncCard(){return '';}

/* Check AMB periodically only when this device has no unsynced edits. */
function backgroundPull(){
  if(!nfplSync.autoSync||!syncHosted()||nfplSyncBusy)return;
  const current=syncPayload();
  if(!nfplLastSyncedState){
    syncPull(true);
    return;
  }
  if(current===nfplLastSyncedState)syncPull(true);
}

setInterval(()=>{
  if(!nfplSync.autoSync||!syncHosted()||nfplSyncBusy)return;
  const current=syncPayload();
  if(current!==nfplLastSyncedState)syncPush(false);
},6000);

setInterval(backgroundPull,12000);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')backgroundPull();
});
window.addEventListener('focus',backgroundPull);

if(syncHosted())setTimeout(()=>syncPull(true),500);
render();
</script>

        if(img && dataUrl) img.src=dataUrl;
      })

      .nfplGetHeroAsset();

    document.addEventListener('DOMContentLoaded',loadHero);
  }else{
    loadHero();
  }
})();
