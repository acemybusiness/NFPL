<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<title>NFPL Phone Control v1.3.1</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05090d;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#engine{position:fixed;left:-10px;top:-10px;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
.app{width:min(430px,100%);margin:auto;padding:7px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:9px 10px;background:#0b151f;border:1px solid #30475d;border-top:3px solid #ff7a00;border-radius:14px}
.brand b{font-size:1.05rem}.brand small{display:block;color:#aebdca;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:5px}.actions button{min-height:34px;border-radius:9px;padding:5px 7px;font-weight:900;font-size:.62rem}
.full{background:#142332;color:#dce8f4;border:1px solid #4c667c}.sync{background:#08131c;color:#8ff0ae;border:1px solid #ff8117}
.status{margin:7px 0;color:#a9bacb;font-size:.62rem;font-weight:800;text-align:right}
.clock{display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:5px}
.clock>div{padding:7px 5px;border:1px solid #2e4c68;border-radius:12px;background:#112b4d;text-align:center;min-width:0}
.clock span{display:block;font-size:.54rem;color:#b9d7f4;font-weight:900}.clock b{display:block;margin-top:2px;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock .time{background:#16375f}.clock .time b{font-size:1.45rem}
.clockActions{display:grid;grid-template-columns:1.2fr .8fr;gap:6px;margin-top:6px}
.clockActions button,.ctl button{min-height:44px;border-radius:11px;font-weight:950}
.start{background:linear-gradient(#ffad35,#ff7900);border:0;color:#111}.pause{background:#ffd8d0;border:1px solid #ef9587;color:#7d1d13}
.state{display:flex;align-items:center;justify-content:center;background:#0d1823;border:1px solid #2f485e;border-radius:11px;font-size:.58rem;font-weight:900}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}
.ctl button{font-size:.7rem}.secondary{background:#e2edf6;color:#163452;border:1px solid #b9cbdb}.primary{background:linear-gradient(#ffb440,#ff8611);color:#111;border:1px solid #ffc76b}
.tables{display:flex;flex-direction:column;gap:8px}
.table{padding:7px;border:1px solid #9a6a24;border-radius:14px;background:radial-gradient(circle at 50% 20%,rgba(255,153,31,.08),transparent 38%),linear-gradient(#10243a,#08131f)}
.th{display:flex;justify-content:space-between;align-items:center;padding:1px 3px 6px;border-bottom:1px solid rgba(255,164,42,.26);margin-bottom:5px}.th b{font-size:.95rem}.th span{font-size:.6rem;color:#b9c8d6}.th strong{font-size:.58rem;background:#ff951f;color:#111;border-radius:999px;padding:3px 7px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seat{min-height:90px;border-radius:11px;border:1px solid #77501f;background:linear-gradient(145deg,rgba(255,153,31,.055),transparent 38%),#0b1824;color:#eef5fb;padding:6px;text-align:left;position:relative;overflow:hidden}
.seat.occupied:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#ff7811,#ffb13f,#ff7811)}
.seatTop{display:flex;justify-content:space-between;font-size:.54rem;color:#ffb45b;font-weight:900}.pm{display:grid;grid-template-columns:48px minmax(0,1fr);gap:5px;align-items:center;margin-top:3px}.car{width:48px;height:42px;display:grid;place-items:center;overflow:visible}.car-sprite{--accent:#f97316;position:relative;display:inline-block;width:48px;aspect-ratio:1335/1148;vertical-align:middle;filter:drop-shadow(0 3px 4px rgba(0,0,0,.62));transform-origin:center}.car-sprite .car-base,.car-sprite .car-accent{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain}.car-sprite .car-base{background-image:var(--car-base)}.car-sprite .car-accent{background:var(--accent);-webkit-mask-image:var(--car-mask);mask-image:var(--car-mask);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;mix-blend-mode:multiply;opacity:.98}.pt{min-width:0}.pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}.pt span{display:block;color:#ffad57;font-size:.51rem;margin-top:2px;font-weight:800}.stats{display:flex;justify-content:space-between;border-top:1px solid rgba(255,164,42,.18);margin-top:3px;padding-top:3px;color:#c8d2dc;font-size:.52rem}
.empty{border-style:dashed;border-color:#4c5f70;background:#09131c;display:flex;flex-direction:column}.open{flex:1;display:grid;place-items:center;color:#718495;font-weight:900}
.blank{padding:28px 12px;text-align:center;color:#9fb1c2;border:1px dashed #3e566d;border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:50}.modal.show{display:flex}.sheet{width:min(430px,100%);background:#0c1925;border:1px solid #a36c25;border-radius:16px;padding:12px}.sheet h3{margin:0 0 8px}.list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.list button,.sheet>.row button{min-height:44px;border-radius:10px;font-weight:900}.list button{background:#e2edf6;color:#17344f;border:0}.row{display:flex;gap:6px;margin-top:8px}.row>*{flex:1}.out{background:#ffd8d0;color:#7d1d13;border:0}.rebuy{background:#c7f1d5;color:#0a6032;border:0}.cancel{background:#1b2c3b;color:#dce8f4;border:1px solid #4c667c}
</style>
</head>
<body>
<iframe id="engine" src="../" title="NFPL shared engine"></iframe>
<div class="app">
  <header class="top"><div class="brand"><b>NFPL Game Control</b><small id="event">Connecting to main NFPL…</small></div><div class="actions"><button class="full" id="full">Full Site</button><button class="sync" id="sync">Sync</button></div></header>
  <div class="status" id="syncStatus">Connecting…</div>
  <section class="clock">
    <div><span>CURRENT</span><b id="current">—</b></div>
    <div class="time"><span>TIME</span><b id="time">--:--</b></div>
    <div><span>NEXT</span><b id="next">—</b></div>
  </section>
  <section class="clockActions"><button id="clockBtn" class="start" disabled>Start Clock</button><div class="state" id="clockState">WAITING</div></section>
  <section class="ctl"><button id="balance" class="secondary" disabled>Balance Tables</button><button id="structure" class="primary" disabled>Check Tables</button></section>
  <main class="tables" id="tables"><div class="blank">Loading shared NFPL game…</div></main>
</div>
<div class="modal" id="koModal"><div class="sheet"><h3 id="koTitle">Knockout</h3><div id="koBody"></div><div class="row"><button class="cancel" id="koCancel">Cancel</button></div></div></div>
<script>
const $=id=>document.getElementById(id),frame=$('engine'); let bridge=null,last='',victimId='',killerId='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function installBridge(){
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    const s=d.createElement('script');
    s.textContent=`window.NFPL_PHONE_BRIDGE={
      snap:()=>JSON.parse(JSON.stringify(state)),
      car:(c)=>carSvg(c),
      clock:()=>formatClock(),
      start:()=>startClock(), pause:()=>pauseClock(),
      balance:()=>autoBalanceTables(false,'phone control'),
      structure:()=>checkTableStructure('phone control'),
      final:()=>makeFinalTable(),
      transition:()=>tableTransitionInfo(),
      candidates:(id)=>{const v=player(id);return v?knockoutCandidates(v).map(p=>({id:p.id,name:p.name,number:p.number,carColor:p.carColor})):[]},
      koInfo:(id)=>{const v=player(id),m=state.settings.money||{};return {victim:v?{id:v.id,name:v.name}:null,canRebuy:rebuyIsAvailable(),rebuy:Number(m.rebuy||0),bounty:v&&bountyApplies(v)?Number(m.bounty||0):0}},
      finishKO:(v,k,r)=>{pendingKnockoutId=v;pendingKillerId=k;completeKnockout(r)},
      sync:()=>syncNow(),
      syncStatus:()=>typeof nfplSync!=='undefined'?nfplSync.lastMessage||'Ready':'Ready',
      event:()=>activeEventLabel()
    };`;
    d.body.appendChild(s);
    bridge=w.NFPL_PHONE_BRIDGE||null;
    if(bridge){
      const engineStyle=w.getComputedStyle(d.documentElement);
      document.documentElement.style.setProperty('--car-base',engineStyle.getPropertyValue('--car-base'));
      document.documentElement.style.setProperty('--car-mask',engineStyle.getPropertyValue('--car-mask'));
      enable();render();return
    }
  }catch(e){}
  setTimeout(installBridge,350)
}
frame.addEventListener('load',()=>setTimeout(installBridge,250));
function enable(){['clockBtn','balance','structure'].forEach(id=>$(id).disabled=false);$('syncStatus').textContent='Shared with main NFPL'}
function render(){
 if(!bridge)return;
 let st;try{st=bridge.snap()}catch(e){bridge=null;return setTimeout(installBridge,500)}
 const bl=st.settings.blindLevels[st.currentBlind]||st.settings.blindLevels[0], nx=st.settings.blindLevels[st.currentBlind+1];
 $('event').textContent=bridge.event()||'NFPL';
 $('current').textContent=bl?`L${st.currentBlind+1} • ${bl.sb}/${bl.bb}`:'—';
 $('time').textContent=bridge.clock();
 $('next').textContent=nx?`L${st.currentBlind+2} • ${nx.sb}/${nx.bb}`:'Game End';
 $('clockBtn').textContent=st.clock.running?'Pause Clock':'Start Clock'; $('clockBtn').className=st.clock.running?'pause':'start';
 const tr=bridge.transition(); $('clockState').textContent=st.clock.running?'RUNNING':(tr.finalReady||tr.canReduce?'PAUSED • BREAK':'PAUSED');
 $('structure').textContent=tr.finalReady?'Make Final Table':(tr.canReduce?'Break / Reduce Tables':'Check Tables');
 $('syncStatus').textContent=bridge.syncStatus();
 const pmap=Object.fromEntries(st.players.map(p=>[p.id,p]));
 $('tables').innerHTML=(st.tables||[]).length?(st.tables||[]).map(t=>`<section class="table"><div class="th"><div><b>${esc(t.name)}</b> <span>${t.seats.filter(s=>s.playerId).length} players</span></div>${st.finalTableSet&&t.id===1?'<strong>FINAL</strong>':''}</div><div class="seats">${t.seats.map((s,i)=>{const p=pmap[s.playerId];if(!p)return `<div class="seat empty"><div class="seatTop"><span>Seat ${i+1}</span><span>Open</span></div><div class="open">OPEN</div></div>`;let car='';try{car=bridge.car(p.carColor)}catch(e){}return `<button class="seat occupied" data-ko="${esc(p.id)}"><div class="seatTop"><span>Seat ${i+1}</span><span>#${esc(p.number||'')}</span></div><div class="pm"><div class="car">${car}</div><div class="pt"><b>${esc(p.name)}</b><span>${p.out?'OUT':'Tap to Knock Out'}</span></div></div><div class="stats"><span>KO ${Number(p.knockouts||0)}</span><span>RB ${Number(p.rebuys||0)}</span></div></button>`}).join('')}</div></section>`).join(''):'<div class="blank">No tables built yet. Build and seat the game on the main NFPL site, then Sync.</div>';
 document.querySelectorAll('[data-ko]').forEach(b=>b.addEventListener('click',()=>openKO(b.dataset.ko)));
}
$('clockBtn').onclick=()=>{const st=bridge.snap();st.clock.running?bridge.pause():bridge.start();setTimeout(render,120)}
$('balance').onclick=()=>{bridge.balance();setTimeout(render,200)}
$('structure').onclick=()=>{const tr=bridge.transition();tr.finalReady?bridge.final():bridge.structure();setTimeout(render,250)}
$('sync').onclick=()=>{bridge&&bridge.sync();setTimeout(render,600)}
$('full').onclick=()=>{if(confirm('Open the full NFPL site?\\n\\nRotate your phone sideways for the best view.'))location.href='../'}
$('koCancel').onclick=()=>closeKO();$('koModal').addEventListener('click',e=>{if(e.target===$('koModal'))closeKO()})
function openKO(id){victimId=id;killerId='';const info=bridge.koInfo(id),c=bridge.candidates(id);$('koTitle').textContent=`Who knocked out ${info.victim?.name||'this player'}?`;$('koBody').innerHTML=c.length?`<div class="list">${c.map(x=>`<button data-killer="${esc(x.id)}">${esc(x.name)} #${esc(x.number||'')}</button>`).join('')}</div>`:'<div class="blank">No eligible player is seated at the same table.</div>';document.querySelectorAll('[data-killer]').forEach(b=>b.onclick=()=>chooseKiller(b.dataset.killer));$('koModal').classList.add('show')}
function chooseKiller(id){killerId=id;const info=bridge.koInfo(victimId);$('koTitle').textContent='What happens next?';$('koBody').innerHTML=`<div class="row">${info.canRebuy?`<button class="rebuy" id="rebuy">Rebuy${info.rebuy?' • $'+info.rebuy:''}</button>`:''}<button class="out" id="out">Eliminated / Out</button></div>`;if(info.canRebuy)$('rebuy').onclick=()=>finish('rebuy');$('out').onclick=()=>finish('out')}
function finish(result){bridge.finishKO(victimId,killerId,result);closeKO();setTimeout(render,300)}
function closeKO(){$('koModal').classList.remove('show');victimId='';killerId=''}
setInterval(()=>{if(bridge)render()},1000);
</script>
</body>
</html>
