<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFPL -29</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04101f}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./index.html?v=nfpl29-lock-2" title="NFPL -29"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const s=d.createElement('script');
  s.textContent=`(function(){
    if(window.__NFPL29_LOCKED_BUILD_V2__)return;window.__NFPL29_LOCKED_BUILD_V2__=true;

    const WEEK1_SCORES={'FRENCHIE':19,'KAYLA':18,'J2C':17,'ERNLY':16,'CEPHUS':15,'SAM':14,'MATTY-ICE':13,'STEVE':12,'Q2B':11,'SOQ':10,'LPQ':9,'B-WIDOW':8,'JOKER':7,'YODA':6,'S-KING':5,'ALL-DAY':4,'7X':3,'JK47':2,'TEDDY':0};
    const WEEK1_PLAYERS=Object.keys(WEEK1_SCORES);

    function findPlayer(x){
      x=String(x).toUpperCase();
      return state.players.find(p=>String(p.name||'').toUpperCase()===x||String(p.alias||'').toUpperCase()===x);
    }

    function removeStu(){
      const stu=state.players.find(p=>String(p.name||'').toUpperCase()==='STU');
      if(!stu)return;
      state.tables=(state.tables||[]).map(t=>({...t,seats:(t.seats||[]).map(seat=>seat&&seat.playerId===stu.id?{...seat,playerId:null}:seat)}));
      state.players.forEach(p=>{if(p.partner===stu.id)p.partner='';});
      state.players=state.players.filter(p=>p.id!==stu.id);
    }

    function ensureSteve(){
      let p=findPlayer('STEVE');
      if(p)return p;
      p={id:uid(),name:'Steve',number:nextAvailablePlayerNumber(),carColor:nextUnusedCarColor(),scores:[],active:true,checkedIn:false,checkinAt:null,out:false,seat:null,table:null,locked:false,preferredTable:1,preferredSeat:1,partner:'',alias:'',stack:Number(state.settings.startingStack||7000),rebuys:0,addon1s:0,addon2s:0,addons:0,addonTransactions:[],bounties:0,bountyBuyIn:false,badBeatBuyIn:false,highHandBuyIn:false,startingAddonSelected:false,eliminatedBy:'',lastOutOrder:null,knockouts:0,knockoutEvents:[]};
      state.players.push(p);
      if(typeof syncAlphabeticalPlayerNumbers==='function')syncAlphabeticalPlayerNumbers();
      return p;
    }

    function enforceLockedSeason(){
      if(!state||!state.settings||!Array.isArray(state.players))return;
      state.settings.season='NFPL -29';
      state.settings.leagueName='Newfound Poker League';
      state._nfpl29SeasonLocked=true;
      state._nfpl29Week1Locked=true;

      removeStu();
      ensureSteve();
      if(typeof syncAlphabeticalPlayerNumbers==='function')syncAlphabeticalPlayerNumbers();

      const checkedIds=[];
      const lockedRosterIds=[];
      WEEK1_PLAYERS.forEach(name=>{
        const p=findPlayer(name);if(!p)return;
        p.scores=Array.isArray(p.scores)?p.scores:[];
        while(p.scores.length<1)p.scores.push(null);
        p.scores[0]=WEEK1_SCORES[name];
        p.checkedIn=true;
        checkedIds.push(p.id);
        lockedRosterIds.push(p.id);
      });

      state.settings.absentScore=19;
      state.weekAttendance=state.weekAttendance&&typeof state.weekAttendance==='object'?state.weekAttendance:{};
      const prior=state.weekAttendance[1]||{};
      state.weekAttendance[1]={...prior,week:1,rosterIds:[...lockedRosterIds],checkedIds:[...checkedIds],absentIds:[],rosterSize:lockedRosterIds.length,finalized:true,locked:true};

      state.completedWeeks=Array.isArray(state.completedWeeks)?state.completedWeeks:[];
      if(!state.completedWeeks.includes(1))state.completedWeeks.push(1);
      state.lockedWeeks=Array.isArray(state.lockedWeeks)?state.lockedWeeks:[];
      if(!state.lockedWeeks.includes(1))state.lockedWeeks.push(1);

      state.highHands=Array.isArray(state.highHands)?state.highHands:[];
      const gordon=findPlayer('GORDO')||findPlayer('S-KING');
      const hhPlayer=gordon?gordon.name:'S-King';
      const hi=state.highHands.findIndex(h=>String(h.week).toUpperCase()==='W1'||Number(h.week)===1);
      const hh={week:'W1',player:hhPlayer,hand:'QQQ66',updatedAt:Date.now(),locked:true};
      if(hi>=0)state.highHands[hi]={...state.highHands[hi],...hh};else state.highHands.push(hh);

      if(!state._nfpl29Initialized){
        state._nfpl29Initialized=true;
        if(Number(state.currentWeek||1)<=1)state.currentWeek=2;
      }
    }

    function protectDestructiveFunction(name){
      const original=window[name];
      if(typeof original!=='function'||original.__nfpl29Protected)return;
      const wrapped=function(){
        const answer=prompt('NFPL -29 is LOCKED. Type UNLOCK to permanently change or delete league data.');
        if(String(answer||'').trim().toUpperCase()!=='UNLOCK'){
          if(typeof toast==='function')toast('League locked — no data changed');
          return;
        }
        return original.apply(this,arguments);
      };
      wrapped.__nfpl29Protected=true;
      window[name]=wrapped;
    }

    function installProtection(){
      ['deletePlayer','resetAll','resetApp','resetLeague','clearLeague','newLeague','clearAllData','resetEverything'].forEach(protectDestructiveFunction);
    }

    function installUnknown(){
      if(typeof window.openKnockout!=='function'||window.__UNKNOWN_INSTALLED)return;
      window.__UNKNOWN_INSTALLED=true;
      const old=window.openKnockout;
      window.openKnockout=function(id){
        const r=old.apply(this,arguments);
        setTimeout(()=>{
          const o=document.getElementById('koOverlay'),list=o&&o.querySelector('.ko-list');
          if(!list||list.querySelector('[data-unknown-ko]'))return;
          const b=document.createElement('button');
          b.className='ko-choice';b.dataset.unknownKo='1';
          b.innerHTML='<span><b>Unknown / Not Recorded</b><small>Marks this player out without crediting a knockout or bounty.</small></span>';
          b.onclick=()=>{if(typeof closeKnockout==='function')closeKnockout();markOut(id);if(typeof toast==='function')toast('Saved as Unknown — no knockout or bounty credited');};
          list.appendChild(b);
        },0);
        return r;
      };
    }

    function addLockBadge(){
      if(document.getElementById('nfpl29LockBadge'))return;
      const host=document.querySelector('.hero .head')||document.querySelector('.hero')||document.body;
      const badge=document.createElement('div');badge.id='nfpl29LockBadge';badge.textContent='NFPL -29 • LEAGUE LOCKED • W1 LOCKED';
      badge.style.cssText='margin-top:6px;padding:6px 9px;border-radius:999px;background:#12385f;border:1px solid #ffae32;color:#ffcf78;font-size:.68rem;font-weight:1000;text-align:center';
      host.appendChild(badge);
    }

    enforceLockedSeason();
    installProtection();
    installUnknown();
    if(typeof save==='function')save();
    if(typeof render==='function')render();
    addLockBadge();

    setInterval(()=>{
      try{
        enforceLockedSeason();
        installProtection();
        installUnknown();
        if(typeof save==='function')save();
        addLockBadge();
      }catch(e){console.warn('NFPL-29 lock guard',e);}
    },3000);

    if(typeof syncPush==='function')setTimeout(()=>{try{syncPush(true)}catch(e){}},1200);
    if(typeof toast==='function')toast('NFPL -29 locked • Steve replaces Stu • Week 1 protected');
  })();`;
  d.body.appendChild(s);
});
</script>
</body>
</html>
