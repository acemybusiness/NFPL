<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFPL Week 1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04101f}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./index.html?v=week1-final-1" title="NFPL"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const s=d.createElement('script');
  s.textContent=`(function(){
    if(window.__NFPL_WEEK1_FINAL__)return;window.__NFPL_WEEK1_FINAL__=true;
    function findPlayer(x){x=String(x).toUpperCase();return state.players.find(p=>String(p.name||'').toUpperCase()===x||String(p.alias||'').toUpperCase()===x)}
    function ensureSteve(){
      if(findPlayer('STEVE'))return;
      const p={id:uid(),name:'Steve',number:nextAvailablePlayerNumber(),carColor:nextUnusedCarColor(),scores:[],active:true,checkedIn:false,checkinAt:null,out:false,seat:null,table:null,locked:false,preferredTable:1,preferredSeat:1,partner:'',alias:'',stack:Number(state.settings.startingStack||7000),rebuys:0,addon1s:0,addon2s:0,addons:0,addonTransactions:[],bounties:0,bountyBuyIn:false,badBeatBuyIn:false,highHandBuyIn:false,startingAddonSelected:false,eliminatedBy:'',lastOutOrder:null,knockouts:0,knockoutEvents:[]};
      state.players.push(p);if(typeof syncAlphabeticalPlayerNumbers==='function')syncAlphabeticalPlayerNumbers();
    }
    function applyWeek1(){
      ensureSteve();
      const scores={'FRENCHIE':19,'KAYLA':18,'J2C':17,'ERNLY':16,'CEPHUS':15,'SAM':14,'MATTY-ICE':13,'STU':12,'Q2B':11,'SOQ':10,'LPQ':9,'B-WIDOW':8,'JOKER':7,'YODA':6,'S-KING':5,'ALL-DAY':4,'7X':3,'JK47':2,'TEDDY':0};
      const ids=[];
      Object.entries(scores).forEach(([name,score])=>{const p=findPlayer(name);if(!p)return;p.scores=Array.isArray(p.scores)?p.scores:[];while(p.scores.length<1)p.scores.push(null);p.scores[0]=score;p.checkedIn=true;p.out=score!==0;p.lastOutOrder=score===0?null:score;ids.push(p.id);});
      state.currentWeek=1;state.settings.absentScore=19;
      state.weekAttendance=state.weekAttendance&&typeof state.weekAttendance==='object'?state.weekAttendance:{};
      state.weekAttendance[1]={...(state.weekAttendance[1]||{}),week:1,rosterIds:[...ids],checkedIds:[...ids],absentIds:[],rosterSize:ids.length};
      state.completedWeeks=Array.isArray(state.completedWeeks)?state.completedWeeks:[];if(!state.completedWeeks.includes(1))state.completedWeeks.push(1);
      state.lockedWeeks=Array.isArray(state.lockedWeeks)?state.lockedWeeks:[];if(!state.lockedWeeks.includes(1))state.lockedWeeks.push(1);
      state.outOrder=ids.filter(id=>{const p=player(id);return p&&Number(p.scores?.[0])!==0;}).sort((a,b)=>Number(player(b).scores[0])-Number(player(a).scores[0]));
      state.highHands=Array.isArray(state.highHands)?state.highHands:[];
      const hhPlayer=findPlayer('GORDO')||findPlayer('S-KING');
      const hhName=hhPlayer?hhPlayer.name:'S-King';
      const hi=state.highHands.findIndex(h=>String(h.week).toUpperCase()==='W1'||Number(h.week)===1);
      const hh={week:'W1',player:hhName,hand:'QQQ66',updatedAt:Date.now()};
      if(hi>=0)state.highHands[hi]={...state.highHands[hi],...hh};else state.highHands.push(hh);
      save();render();if(typeof toast==='function')toast('Week 1 loaded • Teddy 1st • Gordon HH QQQ66');
    }
    function installUnknown(){
      if(typeof window.openKnockout!=='function'||window.__UNKNOWN_INSTALLED)return;window.__UNKNOWN_INSTALLED=true;
      const old=window.openKnockout;window.openKnockout=function(id){const r=old.apply(this,arguments);setTimeout(()=>{const o=document.getElementById('koOverlay'),list=o&&o.querySelector('.ko-list');if(!list||list.querySelector('[data-unknown-ko]'))return;const b=document.createElement('button');b.className='ko-choice';b.dataset.unknownKo='1';b.innerHTML='<span><b>Unknown / Not Recorded</b><small>Marks this player out without crediting a knockout or bounty.</small></span>';b.onclick=()=>{if(typeof closeKnockout==='function')closeKnockout();markOut(id);if(typeof toast==='function')toast('Saved as Unknown — no knockout or bounty credited');};list.appendChild(b);},0);return r;};
    }
    applyWeek1();installUnknown();
  })();`;
  d.body.appendChild(s);
});
</script>
</body>
</html>
