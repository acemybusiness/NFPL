<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a33">
<title>NFPL Sync Repair</title>
<style>
body{margin:0;background:#04101f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(520px,100%);background:#102a4d;border:1px solid #31577d;border-radius:24px;padding:26px;box-sizing:border-box;text-align:center}.icon{width:120px;height:120px;border-radius:26px;margin:0 auto 18px;display:block}.title{font-size:2rem;font-weight:900;margin:0 0 10px}.copy{color:#c6d7e8;line-height:1.5}.btn{width:100%;min-height:58px;border:0;border-radius:16px;background:#ff8a00;color:#211406;font-size:1.1rem;font-weight:900;margin-top:20px}.small{font-size:.85rem;color:#9db6ce;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<img class="icon" src="/icon-192.png?v=syncfix1" alt="NFPL icon">
<h1 class="title">NFPL Sync Repair</h1>
<p class="copy">This clears only the saved sync connection and revision on this device. It does not erase your league/game data.</p>
<button class="btn" id="repairBtn">Repair Sync & Open NFPL</button>
<p class="small" id="status">Ready.</p>
</div>
<script>
const btn=document.getElementById('repairBtn');
const status=document.getElementById('status');
btn.addEventListener('click',()=>{
  try{
    localStorage.removeItem('nfpl_amb_sync_endpoint');
    localStorage.removeItem('nfpl_pv2_sync_config');
    status.textContent='Sync connection reset. Opening NFPL…';
    btn.disabled=true;
    setTimeout(()=>location.replace('/?syncfix='+Date.now()),350);
  }catch(e){
    status.textContent='Could not reset sync settings. Please retry.';
  }
});
</script>
</body>
</html>
